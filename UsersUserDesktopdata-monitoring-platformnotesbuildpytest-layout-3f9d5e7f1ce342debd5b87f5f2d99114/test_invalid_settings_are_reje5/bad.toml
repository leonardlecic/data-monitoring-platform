# Design defaults, not an active collection schedule.
[app]
display_timezone = "Europe/Zagreb"
database_path = "data/monitoring.sqlite3"

[collection]
timeout_seconds = 15
max_attempts = 3
weather_interval_minutes = 60
prices_interval_minutes = 1440

[weather]
latitude = 45.8150
longitude = 15.9819

[prices]
# Confirm access and endpoint contract before integration.
enabled = "false"
daily_request_budget = 100
